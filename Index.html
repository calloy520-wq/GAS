<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>廢村開拓</title>
<style>
:root{
  --bg:#17140f; --bg2:#201c15; --card:#282319; --line:#3a3328;
  --ink:#e8dfcd; --dim:#9c9280; --gold:#d9a84b; --green:#7fae5c;
  --red:#c4604c; --blue:#6c93b0; --warn:#d6a33c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body{padding:0 0 90px;max-width:760px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:700}
button{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){border-color:var(--gold);background:#322b1f}
button:disabled{opacity:.38;cursor:not-allowed}
button.pri{background:var(--gold);color:#241d10;border-color:var(--gold);font-weight:700}
button.pri:hover:not(:disabled){background:#e8bb5e}
input,select{font-family:inherit;font-size:15px;color:var(--ink);background:#1b1812;
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.dim{color:var(--dim)}.sm{font-size:12.5px}.c{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}

/* ── 頂部狀態 ── */
#top{position:sticky;top:0;z-index:30;background:linear-gradient(#17140fee,#17140fdd);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 12px}
#dayline{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
#dayline b{font-size:18px;color:var(--gold)}
#res{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.res{background:#1b1812;border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:13px;white-space:nowrap}
.res.low{border-color:var(--red);color:#f0a08c}
.res b{color:var(--ink);font-weight:600}

/* ── 住民卡 ── */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px;margin:8px 0}
.pcard.sick{border-color:#6b4a3a;background:#2a211a}
.pcard.dead{opacity:.4}
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pname{font-weight:700;font-size:15.5px}
.tag{font-size:11.5px;background:#1b1812;border:1px solid var(--line);
  border-radius:20px;padding:1.5px 8px;color:var(--dim);white-space:nowrap}
.bars{display:flex;gap:7px;margin:7px 0 0}
.bw{flex:1}
.bl{font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
.bar{height:5px;background:#1b1812;border-radius:3px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.jobs{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}
.jb{font-size:12.5px;padding:5px 9px;border-radius:7px;background:#1b1812;
  border:1px solid var(--line);cursor:pointer}
.jb.on{background:var(--gold);color:#241d10;border-color:var(--gold);font-weight:700}
.jb.no{opacity:.3;cursor:not-allowed}
.tag.cur{background:var(--gold);color:#241d10;border-color:var(--gold);font-weight:700}

/* ── 底部操作 ── */
#bot{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#120f0bf2;
  backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:9px 12px}
#bot .row{max-width:760px;margin:0 auto}

/* ── 面板 / 彈窗 ── */
#sheet{position:fixed;inset:0;z-index:60;background:#0a0806e8;display:none;
  overflow-y:auto;padding:16px 12px 40px}
#sheet.on{display:block}
#sbox{max-width:700px;margin:0 auto;background:var(--bg2);
  border:1px solid var(--line);border-radius:14px;padding:15px}
.x{position:sticky;top:0;float:right;font-size:20px;line-height:1;background:none;border:none;color:var(--dim);padding:2px 6px}

/* ── 報告 ── */
.rep{white-space:pre-wrap;font-size:14px;line-height:1.75;background:#1b1812;
  border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.good{color:var(--green)}.bad{color:var(--red)}.warnc{color:var(--warn)}

.bitem{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.bitem:last-child{border-bottom:none}
.bico{font-size:24px;width:32px;text-align:center}
.prog{height:6px;background:#1b1812;border-radius:3px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--gold)}
.spot{display:flex;gap:9px;align-items:flex-start;padding:7px 0}
.lock{opacity:.35}
.logday{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:9px 0;white-space:pre-wrap;font-size:13.5px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:80;
  background:#2c2518;border:1px solid var(--gold);border-radius:9px;padding:9px 15px;
  font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
</style>
</head>
<body>

<!-- 開場 -->
<div id="intro" style="padding:28px 16px">

  <h1 class="c" style="font-size:27px;margin:6px 0">廢村開拓</h1>

<script>
// ============================================================
//  前端：狀態、畫面、操作
//  引擎（Engine.html）是唯一真相來源；這裡只負責呈現與送指令。
// ============================================================
var P = null;            // 目前存檔
var NICK = '';
var LAST = {};           // 上一次的派工 { pid: job }
var SRV = (typeof google !== 'undefined' && google.script && google.script.run);

// ---- 伺服器呼叫（沒有後端時退回 localStorage，離線也能玩）----
function srv(action, payload){
  return new Promise(function(res, rej){
    if (!SRV) return res(localFallback(action, payload));
    google.script.run
      .withSuccessHandler(function(j){
        var r; try { r = JSON.parse(j); } catch(e){ return rej(new Error('回傳格式錯誤')); }
        r.ok ? res(r.data) : rej(new Error(r.error || '未知錯誤'));
      })
      .withFailureHandler(function(e){ rej(new Error((e && e.message) || '連線失敗')); })
      .api(action, JSON.stringify(payload || {}));
  });
}
function lsKey(n){ return 'village_' + n; }
function localFallback(action, p){
  p = p || {};
  try {
    if (action === 'load'){
      var raw = localStorage.getItem(lsKey(p.nick));
      return { nick: p.nick, save: raw ? JSON.parse(raw) : null };
    }
    if (action === 'save'){ localStorage.setItem(lsKey(p.nick), JSON.stringify(p.save)); return { saved:true }; }
    if (action === 'bury'){
      var arr = JSON.parse(localStorage.getItem('village_ruins') || '[]');
      arr.unshift(p.ruin); localStorage.setItem('village_ruins', JSON.stringify(arr.slice(0,20)));
      return { buried:true };
    }
    if (action === 'ruins'){
      return { ruins: JSON.parse(localStorage.getItem('village_ruins') || '[]').slice(0, p.n || 6) };
    }
    if (action === 'narrate') return { text:null, reason:'offline' };
    if (action === 'meta') return { ver: VER, ai:false };
  } catch(e){}
  return {};
}

// ---- 存檔（去抖，不要每次操作都打伺服器）----
var _sv = null;
function saveSoon(){
  if (_sv) clearTimeout(_sv);
  _sv = setTimeout(function(){
    _sv = null;
    if (!P) return;
    srv('save', { nick: NICK, save: P }).catch(function(e){ toast('存檔失敗：' + e.message); });
  }, 600);
}
function flushSave(){
  if (_sv){ clearTimeout(_sv); _sv = null; }
  if (!P) return Promise.resolve();
  return srv('save', { nick: NICK, save: P }).catch(function(){});
}

// ---- 小工具 ----
function $(id){ return document.getElementById(id); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
var _tt = null;
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  if (_tt) clearTimeout(_tt);
  _tt = setTimeout(function(){ t.classList.remove('on'); }, 2300);
}
function openSheet(html){ $('sbox').innerHTML = '<button class="x" onclick="closeSheet()">✕</button>' + html; $('sheet').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('on'); $('sbox').innerHTML = ''; }
function barColor(v, max){
  var r = v / max;
  return r > .6 ? 'var(--green)' : (r > .3 ? 'var(--warn)' : 'var(--red)');
}

// ============================================================
//  畫面
// ============================================================
function render(){
  if (!P) return;
  renderTop(); renderPeople();
  $('btnDay').disabled = !!P.run.over;
  $('btnSkip').disabled = !!P.run.over;
}

function renderTop(){
  var S = seasonOf(P.run.day), W = WEATHER[P.run.weather], cp = caps(P);
  var crew = alive(P);
  $('dayline').innerHTML =
    '<b>第 ' + P.run.day + ' 天</b>' +
    '<span>' + S.ico + S.nm + '</span>' +
    '<span class="dim">' + W.ico + W.nm + '</span>' +
    '<span class="sp"></span>' +
    '<span class="dim sm">👥 ' + crew.length + '/' + maxPeople(P) + '　🎯 第 ' + WIN_DAY + ' 天</span>';

  var order = ['food','water','wood','stone','herb','coin'];
  var icos = { food:'🌾', water:'💧', wood:'🪵', stone:'🪨', herb:'🌿', coin:'🪙' };
  var n = crew.length || 1;
  var needs = { food: n, water: n * S.thirst, wood: S.warm ? n : 0 };
  $('res').innerHTML = order.map(function(k){
    var v = Math.floor(P.res[k] || 0);
    var low = needs[k] != null && needs[k] > 0 && v < needs[k] * 2;
    var tip = needs[k] ? ' title="每天約消耗 ' + Math.round(needs[k]*10)/10 + '"' : '';
    return '<span class="res' + (low ? ' low' : '') + '"' + tip + '>' + icos[k] + ' <b>' + v + '</b>' +
      (cp[k] && k !== 'coin' ? '<span class="dim">/' + cp[k] + '</span>' : '') + '</span>';
  }).join('');
}

// 人一多（>4）卡片就預設收合，只顯示目前的工作，點一下才展開選單——
// 不然 8 個人每張都攤開整組按鈕，手機上要滑很久才找得到想改的那個人。
// OPEN 只記錄「玩家手動點過的」；沒點過的一律依目前人數動態決定，
// 這樣村子從 3 人長到 8 人時不會變成半開半合的混雜狀態。
var OPEN = {};
var FOLD_AT = 4;
function isOpen(p, crew){
  if (OPEN[p.id] !== undefined) return OPEN[p.id];
  return crew.length <= FOLD_AT;
}
function togglePerson(pid){
  var crew = alive(P), p = byId(P, pid);
  OPEN[pid] = !isOpen(p, crew);
  renderPeople();
}
function toggleAll(){
  var crew = alive(P);
  var anyClosed = crew.some(function(p){ return !isOpen(p, crew); });
  crew.forEach(function(p){ OPEN[p.id] = anyClosed; });
  renderPeople();
}

function renderPeople(){
  var crew = alive(P);
  var dead = P.people.filter(function(p){ return !p.alive; });
  var h = crew.map(personCard).join('');
  if (dead.length){
    h += '<div class="card sm dim" style="padding:9px"><b>已故／離開</b> ' +
      dead.map(function(p){ return esc(p.name); }).join('、') + '</div>';
  }
  $('people').innerHTML = h;
}

function personCard(p){
  var T = TRAITS[p.trait] || {};
  var open = isOpen(p, alive(P));
  var cur = JOBS[LAST[p.id] || 'rest'];

  var h = '<div class="pcard' + (p.sick ? ' sick' : '') + '">';
  h += '<div class="phead" onclick="togglePerson(\'' + p.id + '\')" style="cursor:pointer">' +
    '<span class="pname">' + esc(p.name) + '</span>' +
    '<span class="tag">' + (p.sex === 'f' ? '♀' : '♂') + ' ' + p.age + '</span>' +
    '<span class="tag" title="' + esc(T.desc || '') + '">' + (T.ico||'') + ' ' + esc(T.nm||'') + '</span>' +
    (p.sick ? '<span class="tag" style="border-color:#8a5a44;color:#e8a88c">🤒 ' +
       (p.sick >= 2 ? '病重' : '不適') + '</span>' : '') +
    '<span class="sp"></span>' +
    (open ? '<span class="tag" title="最拿手的活">' + bestSkill(p) + '</span>'
          : '<span class="tag cur">' + cur.ico + cur.nm + '</span>') +
    '<span class="dim sm" style="width:12px;text-align:center">' + (open ? '▾' : '▸') + '</span>' +
    '</div>';

  h += '<div class="bars">' +
    bar('體力', p.stam, C.STAM_MAX) +
    bar('心情', p.mood, C.MOOD_MAX) +
    bar('健康', p.hp, C.HP_MAX) + '</div>';

  if (open){
    h += '<div class="jobs">' + JOB_ORDER.map(function(j){
      var J = JOBS[j];
      var why = jobBlock(P, p, j);
      var on = (LAST[p.id] || 'rest') === j;
      return '<span class="jb' + (on ? ' on' : '') + (why ? ' no' : '') + '"' +
        ' title="' + esc(why || J.hint || '') + '"' +
        (why ? '' : ' onclick="setJob(\'' + p.id + '\',\'' + j + '\')"') + '>' +
        J.ico + J.nm + '</span>';
    }).join('') + '</div>';
  }

  return h + '</div>';
}
function bar(label, v, max){
  var pc = Math.max(0, Math.min(100, v / max * 100));
  return '<div class="bw"><div class="bl"><span>' + label + '</span><span>' + Math.round(v) + '</span></div>' +
    '<div class="bar"><i style="width:' + pc + '%;background:' + barColor(v, max) + '"></i></div></div>';
}
function bestSkill(p){
  var best = null, bv = 0;
  for (var k in SKILLS) if ((p.skills[k]||1) > bv){ bv = p.skills[k]; best = k; }
  return (SKILLS[best].ico || '') + SKILLS[best].nm + ' ' + (Math.round(bv*10)/10);
}

function setJob(pid, job){
  var p = byId(P, pid);
  if (!p) return;
  var why = jobBlock(P, p, job);
  if (why){ toast(why); return; }
  LAST[pid] = job;
  renderPeople();
}

// ---- 自動：開工＋派工 ----
// 按了「自動」就該活得下去，所以它也會自己挑工程開工；
// 只派工不蓋東西的話沒有住所／水井／倉庫，一定撐不過冬天。
var AUTO_BUILD_ORDER = ['shelter','well','farm','store','infirm','shelter','farm','store','wall'];
function autoBuildPick(){
  if (P.site) return null;
  for (var i = 0; i < AUTO_BUILD_ORDER.length; i++){
    var k = AUTO_BUILD_ORDER[i];
    if (!canBuild(P, k)){ try { startBuild(P, k); return k; } catch(e){} }
  }
  return null;
}

function autoJobs(quiet){
  var startedKey = autoBuildPick();
  var crew = alive(P), S = seasonOf(P.run.day), n = crew.length;
  var mapDone = SPOTS.every(function(s){ return P.map.found.indexOf(s.id) >= 0; });
  var q = [];
  // 水：井不一定夠，存量低就補人去挑
  if ((P.res.water||0) < n * 3 * S.thirst) q.push('water');
  if ((P.res.water||0) < n * 1.5) q.push('water');
  if ((P.res.food||0) < n * 3) q.push(P.build.farm > 0 && S.farm > 0 ? 'farm' : 'forage');
  if (S.warm && (P.res.wood||0) < n * 15) q.push('wood');
  // 入冬前囤糧囤柴
  if (P.run.day % 80 > 45 && P.run.day % 80 <= 60){
    if ((P.res.food||0) < n * 22) q.push('forage');
    if ((P.res.wood||0) < n * 22) q.push('wood');
  }
  if (P.site) q.push('build','build');
  if ((P.res.wood||0) < 30) q.push('wood');
  if ((P.res.stone||0) < 25) q.push('stone');
  if (!mapDone) q.push('scout');                 // 走遍了就別再派人踏查
  q.push(P.build.farm > 0 && S.farm > 0 ? 'farm' : 'forage', 'hunt', 'wood');

  var sickOnes = crew.filter(function(p){ return p.sick > 0; });
  var healer = false, qi = 0;
  crew.forEach(function(p){
    if (p.sick >= 2 || p.stam < 25){ LAST[p.id] = 'rest'; return; }
    if (sickOnes.length && !healer && p.sick === 0 && !jobBlock(P, p, 'heal')){
      LAST[p.id] = 'heal'; healer = true; return;
    }
    while (qi < q.length){
      var j = q[qi++];
      if (!jobBlock(P, p, j)){ LAST[p.id] = j; return; }
    }
    LAST[p.id] = 'rest';
  });
  render();
  if (!quiet) toast(startedKey ? ('已自動派工，並開工「' + BUILDS[startedKey].nm + '」')
                               : '已自動派工，可以再手動調整');
}

// ============================================================
//  過一天
// ============================================================
function assignNow(){
  var a = {};
  alive(P).forEach(function(p){
    var j = LAST[p.id] || 'rest';
    if (jobBlock(P, p, j)) j = 'rest';
    a[p.id] = j;
  });
  return a;
}

function nextDay(){
  if (P.run.over) return;
  var rep;
  try { rep = resolveDay(P, assignNow()); }
  catch(e){ toast(e.message); return; }
  // 死掉的人要從派工表移除
  Object.keys(LAST).forEach(function(id){ var p = byId(P, id); if (!p || !p.alive) delete LAST[id]; });
  render(); saveSoon();
  if (P.run.over){ onGameOver(); return; }
  if (rep.ending && rep.ending.open){ onMilestone(rep); return; }
  showReport([rep]);
}

function skipDays(){
  var n = 5;
  var reps = [];
  for (var i = 0; i < n && !P.run.over; i++){
    try { reps.push(resolveDay(P, assignNow())); }
    catch(e){ break; }
    // 出事就停下來讓玩家處理，別讓他連過好幾天才發現全村病倒
    var r = reps[reps.length - 1];
    if (r.deaths.length || r.left.length || r.warn.length || r.joined.length || r.ending){ break; }
  }
  Object.keys(LAST).forEach(function(id){ var p = byId(P, id); if (!p || !p.alive) delete LAST[id]; });
  render(); saveSoon();
  if (P.run.over){ onGameOver(); return; }
  var milestone = reps.filter(function(r){ return r.ending && r.ending.open; })[0];
  if (milestone){ onMilestone(milestone); return; }
  showReport(reps);
}

function showReport(reps){
  if (!reps.length) return;
  var h = '<h3>' + (reps.length > 1 ? '這 ' + reps.length + ' 天' : '第 ' + reps[0].day + ' 天') + '</h3>';
  reps.forEach(function(rep){
    h += '<div class="rep">' + colorLog(rep.text) + '</div>';
  });
  var last = reps[reps.length - 1];
  if (last.warn.length) h += '<p class="warnc sm">⚠️ ' + last.warn.map(esc).join('；') + '</p>';
  h += '<div class="row" style="margin-top:12px">' +
    '<button class="pri sp" onclick="closeSheet()">知道了</button></div>';
  openSheet(h);
}
function colorLog(txt){
  return esc(txt)
    .replace(/(🪦[^\n]*)/g, '<span class="bad">$1</span>')
    .replace(/(⚠️[^\n]*)/g, '<span class="warnc">$1</span>')
    .replace(/(💚[^\n]*|🔨[^\n]*|🏚️[^\n]*)/g, '<span class="good">$1</span>');
}

// ============================================================
//  自由打字指令
//  ① 對得上合法指令 → 照做
//  ② 說得通但不在選單 → 變成有代價的嘗試（後果由引擎算）
//  ③ 物理上不可能 → 允許他說，但世界不配合（數值一格不動）
// ============================================================
var JOB_WORDS = {
  forage:['採集','採野菜','摘','找吃','找食','覓食','撿'],
  hunt:  ['狩獵','打獵','獵','抓野','打野'],
  water: ['取水','打水','挑水','汲水','提水','去溪','找水'],
  wood:  ['伐木','砍柴','砍樹','劈柴','撿柴','弄柴'],
  stone: ['採石','挖石','搬石','鑿石'],
  farm:  ['農耕','種田','耕','下田','種地','澆'],
  build: ['建造','蓋','施工','修','造','幫工'],
  scout: ['踏查','探索','探路','勘','查看四周','去看看','偵查'],
  heal:  ['照護','看護','照顧','醫','治','顧病'],
  rest:  ['休息','歇','睡','躺','放假','休養']
};
var ALL_WORDS = ['大家','全部','所有人','全員','每個人','所有'];
var ABSURD = ['魔法','法術','咒','召喚','變出','飛','瞬移','時光','復活','神蹟','無限','開外掛','作弊','9999','龍','異能'];
// 說得通、但選單裡沒有的冒險嘗試
var RISKY = [
  { k:['懸崖','崖下','峭壁','絕壁'], nm:'垂降到崖下探看', job:'scout', mult:1.9, hurt:0.34 },
  { k:['山洞','洞窟','洞穴','地窖','窖'], nm:'鑽進洞裡摸索', job:'scout', mult:1.7, hurt:0.26 },
  { k:['深山','遠方','更遠','翻過','山另一邊','山那邊'], nm:'往更遠的地方走', job:'scout', mult:2.0, hurt:0.30 },
  { k:['河裡','下水','潛','溪底','捕魚','釣'], nm:'下水摸魚', job:'forage', mult:1.8, hurt:0.20 },
  { k:['夜獵','晚上打獵','摸黑'], nm:'摸黑夜獵', job:'hunt', mult:1.9, hurt:0.38 },
  { k:['野蜂','蜂巢','蜜'], nm:'掏蜂巢', job:'forage', mult:2.2, hurt:0.40 },
  { k:['馴','養那隻','抓來養'], nm:'試著馴服野獸', job:'hunt', mult:1.5, hurt:0.33 }
];

function runCmd(){
  var raw = ($('cmd').value || '').trim();
  if (!raw) return;
  $('cmd').value = '';
  var txt = raw.replace(/\s+/g, '');

  // ── 蓋建築（先比對既有的六種）
  var wantsBuild = /蓋|建|造|修|搭|起|開工/.test(txt);
  for (var bk in BUILDS){
    var B = BUILDS[bk];
    if (txt.indexOf(B.nm) >= 0 && wantsBuild){
      var why = canBuild(P, bk);
      if (why){ cmdSay('🚧', why); return; }
      doStart(bk); cmdSay('🔨', B.nm + ' 開工了。'); return;
    }
  }
  // ── 玩家自己發明的建築
  //    名字是他取的，效果一律從 CUSTOM_ARCH 的固定原型來 —— 文字不能決定數值。
  if (wantsBuild){
    var arch = classifyBuild(txt);
    if (arch){
      var why2 = canCustomBuild(P, txt);
      if (why2){ cmdSay('🚧', why2); return; }
      var nm = extractName(txt), A = CUSTOM_ARCH[arch];
      var cost = CUSTOM_COST(customUsed(P));
      try { startCustomBuild(P, txt); }
      catch(e){ cmdSay('🚧', e.message); return; }
      render(); saveSoon();
      cmdSay(A.ico, '村民們聽懂了你的意思，開始動工蓋「' + esc(nm) + '」。\n' +
        '　它會是一座' + A.nm + '的建物：' + A.desc + '。\n' +
        '　已付出 ' + Object.keys(cost).map(function(k){ return resName(k) + ' ' + cost[k]; }).join('、') +
        '，接下來要派人「🔨建造」把它蓋起來（' + P.site.need + ' 工）。');
      return;
    }
    // 想蓋，但村民不知道那是什麼
    cmdSay('🤷', '村民面面相覷——沒有人知道那該怎麼蓋。\n' +
      '　他們蓋得出來的東西大概是：工坊、灶房、地窖、藥圃、瞭望塔、祠堂、棧道、漁棚這類。');
    return;
  }
  // ── 過一天
  if (/^(過一天|下一天|繼續|天亮|睡吧|過日子)$/.test(txt)){ nextDay(); return; }

  // ── 全員派工
  var jobHit = matchJob(txt);
  var isAll = ALL_WORDS.some(function(w){ return txt.indexOf(w) >= 0; });
  if (jobHit && isAll){
    var okN = 0, blocked = [];
    alive(P).forEach(function(p){
      var why = jobBlock(P, p, jobHit);
      if (why){ blocked.push(p.name); } else { LAST[p.id] = jobHit; okN++; }
    });
    renderPeople();
    cmdSay(JOBS[jobHit].ico, '全村改派去「' + JOBS[jobHit].nm + '」（' + okN + ' 人）' +
      (blocked.length ? '；' + blocked.join('、') + ' 做不了，留下休息。' : '。'));
    return;
  }

  // ── 指名派工
  var who = alive(P).filter(function(p){ return txt.indexOf(p.name) >= 0; });
  if (who.length && jobHit){
    var done = [], bad = [];
    who.forEach(function(p){
      var why = jobBlock(P, p, jobHit);
      if (why) bad.push(why); else { LAST[p.id] = jobHit; done.push(p.name); }
    });
    renderPeople();
    cmdSay(JOBS[jobHit].ico, (done.length ? done.join('、') + ' 去「' + JOBS[jobHit].nm + '」。' : '') +
      (bad.length ? bad.join('；') : ''));
    return;
  }

  // ── 天馬行空但說得通 → 有代價的嘗試
  var risk = RISKY.filter(function(r){ return r.k.some(function(k){ return txt.indexOf(k) >= 0; }); })[0];
  if (risk){
    var target = who[0] || alive(P).filter(function(p){ return p.sick === 0 && p.stam > 30; })[0];
    if (!target){ cmdSay('😮‍💨', '沒有人還有力氣去做這種事。'); return; }
    tryRisky(target, risk);
    return;
  }

  // ── 物理上不可能 → 世界不配合
  if (ABSURD.some(function(w){ return txt.indexOf(w) >= 0; })){
    var p2 = alive(P)[0];
    cmdSay('🌾', pick(P.run, [
      '你把這個想法說出口。' + (p2 ? p2.name + '停下手邊的活，看了你一眼，又低頭繼續做事。' : '沒有人回應。'),
      '話說完，風吹過空地。什麼也沒有發生。',
      '沒有人聽懂你在說什麼。日子還是得照常過。'
    ]));
    return;
  }

  // ── 真的看不懂
  cmdSay('❓', '聽不太懂。可以試著說「叫阿福去砍柴」、「大家休息」、「蓋水井」，或是說一件你想試試看的事。');
}

function matchJob(txt){
  for (var j in JOB_WORDS){
    if (JOB_WORDS[j].some(function(w){ return txt.indexOf(w) >= 0; })) {
      if (j === 'build' && !P.site) continue;   // 「蓋XX」已在前面處理
      return j;
    }
  }
  return null;
}

// 有代價的嘗試：後果完全由引擎算，AI／文字無法影響結果
function tryRisky(p, risk){
  var R = P.run;
  var J = JOBS[risk.job];
  var power = workPower(P, p, risk.job, R) * risk.mult;
  var lines = [];
  var cost = Math.round(J.stam * 1.4);
  p.stam = Math.max(0, p.stam - cost);

  var hurt = chance(R, risk.hurt * ((TRAITS[p.trait]||{}).hurt || 1));
  if (hurt){
    p.sick = Math.min(3, p.sick + 1);
    p.hp = Math.max(0, p.hp - rint(R, 8, 20));
    lines.push(p.name + '去' + risk.nm + '，結果受了傷回來。');
    if (p.hp <= 0){
      p.alive = false; P.stats.lost++;
      lines.push('🪦 ' + p.name + '沒有回來。');
    }
  } else {
    lines.push(p.name + '去' + risk.nm + '。');
  }

  if (p.alive){
    if (risk.job === 'scout'){
      P.map.explored += power;
      lines.push('踏查進度 ＋' + r1(power) + '。');
      SPOTS.forEach(function(s){
        if (P.map.explored >= s.need && P.map.found.indexOf(s.id) < 0){
          P.map.found.push(s.id);
          lines.push(s.ico + ' 發現「' + s.nm + '」——' + s.desc);
          if (s.loot) for (var k in s.loot){ P.res[k] = (P.res[k]||0) + s.loot[k]; }
        }
      });
    } else if (J.res){
      var amt = r1(power);
      P.res[J.res] = (P.res[J.res] || 0) + amt;
      lines.push('帶回 ' + amt + resName(J.res) + '。');
    }
  }
  lines.push('（消耗體力 ' + cost + '）');

  var txt = lines.join('\n');
  P.log.push({ day: P.run.day, season: seasonOf(P.run.day).nm, weather: '✴️', text: '第 ' + P.run.day + ' 天・額外行動\n　' + txt.split('\n').join('\n　') });
  render(); saveSoon();
  cmdSay('✴️', txt);
}

function cmdSay(ico, text){
  openSheet('<h3>' + ico + ' 回應</h3><div class="rep">' + colorLog(text) + '</div>' +
    '<div class="row" style="margin-top:12px"><button class="pri sp" onclick="closeSheet()">好</button></div>');
}

function onGameOver(){
  var e = ENDINGS[P.run.ending] || ENDINGS.wipe;
  var last = P.log.length ? P.log[P.log.length - 1].text : '';
  // 只有「滅村」才會變成廢墟留在世界上；活下來的村子不該被埋掉
  if (P.run.ending === 'wipe' || P.run.ending === 'flee') srv('bury', { nick: NICK, ruin: {
    day: P.run.overDay || P.run.day,
    ending: P.run.ending,
    lost: P.stats.lost,
    lastLog: last,
    names: P.people.map(function(p){ return p.name; })
  }}).catch(function(){});

  var h = '<div class="c" style="font-size:46px">' + e.ico + '</div>' +
    '<h3 class="c" style="font-size:22px;margin:6px 0">' + e.nm + '</h3>' +
    '<p class="c dim">' + e.desc + '</p>' +
    '<div class="card"><div class="row sm"><span class="sp">撐過天數</span><b>' + (P.run.overDay || P.run.day) + ' 天</b></div>' +
    '<div class="row sm"><span class="sp">失去的人</span><b>' + P.stats.lost + '</b></div>' +
    '<div class="row sm"><span class="sp">招攬的人</span><b>' + P.stats.joined + '</b></div>' +
    '<div class="row sm"><span class="sp">完成工程</span><b>' + P.stats.built + '</b></div>' +
    '<div class="row sm"><span class="sp">踏查</span><b>' + Math.round(P.map.explored) + '</b></div></div>' +
    '<div class="rep">' + colorLog(last) + '</div>' +
    '<div class="row" style="margin-top:12px">' +
    '<button class="pri sp" onclick="restart()">再開一局</button>' +
    '<button onclick="openRuins()">看看別人的廢墟</button></div>';

}

  srv('ruins', { nick: NICK, n: 8 }).then(function(d){

    else h += rs.map(function(r){
      return '<div class="card"><div class="row"><b>' + esc(r.nick) + '</b> 的村子' +
        '<span class="sp"></span><span class="dim sm">撐了 ' + r.day + ' 天</span></div>' +
        '<div class="sm dim">失去 ' + r.lost + ' 人　' + esc(r.names || '') + '</div>' +
        (r.lastLog ? '<div class="rep sm">' + colorLog(r.lastLog) + '</div>' : '') + '</div>';
    }).join('');
    h += '<div class="row" style="margin-top:10px"><button class="pri sp" onclick="restart()">再開一局</button></div>';
    openSheet(h);
  }).catch(function(e){ toast('讀不到廢墟：' + e.message); });
}

function restart(){
  P = newRun(NICK);
  LAST = {}; OPEN = {};
  autoJobs();
  closeSheet(); render(); flushSave();
  toast('新的一局開始了');
}

// ============================================================
//  啟動
// ============================================================
function start(){
  var nick = ($('nick').value || '').trim().slice(0, 16);
  if (!nick){ toast('先取個名字吧'); return; }
  $('btnStart').disabled = true;
  srv('load', { nick: nick }).then(function(d){
    NICK = d.nick || nick;
    P = d.save ? ensureShape(d.save) : null;
    OPEN = {};
    if (!P){ P = newRun(NICK); autoJobs(true); }
    else {
      // 回填上次的派工，省得每天重設
      alive(P).forEach(function(p){ LAST[p.id] = JOBS[p.job] ? p.job : 'rest'; });
    }
    $('intro').style.display = 'none';
    $('game').style.display = '';
    render();
    if (P.run.over) onGameOver();
    else if (d.save) toast('歡迎回來，第 ' + P.run.day + ' 天');
  }).catch(function(e){
    $('btnStart').disabled = false;
    toast('載入失敗：' + e.message);
  });
}

document.addEventListener('DOMContentLoaded', function(){
  $('btnStart').onclick = start;
  $('nick').addEventListener('keydown', function(e){ if (e.key === 'Enter') start(); });
  $('btnDay').onclick = nextDay;
  $('btnSkip').onclick = skipDays;
  $('btnBuild').onclick = openBuild;
  $('btnMap').onclick = openMap;
  $('btnLog').onclick = openLog;
  $('btnAuto').onclick = function(){ autoJobs(); };
  $('btnFold').onclick = toggleAll;
  $('btnSame').onclick = function(){ renderPeople(); toast('沿用昨天的派工'); };
  $('btnCmd').onclick = runCmd;
  $('cmd').addEventListener('keydown', function(e){ if (e.key === 'Enter') runCmd(); });
  $('sheet').addEventListener('click', function(e){ if (e.target === $('sheet')) closeSheet(); });
  try { var n = localStorage.getItem('village_lastnick'); if (n) $('nick').value = n; } catch(e){}
});
window.addEventListener('beforeunload', function(){
  try { if (NICK) localStorage.setItem('village_lastnick', NICK); } catch(e){}
});
</script>
